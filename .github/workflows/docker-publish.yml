name: Publish Docker Images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code du dépôt sur le runner GitHub Actions
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Définir le propriétaire du dépôt en minuscules
      # GHCR exige des noms de dépôt en minuscules (ex: saad-mrk, pas Saad-mrk)
      - name: Définir le propriétaire du dépôt en minuscules
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 3. Installer Docker Buildx pour construire les images (multi-plateforme possible)
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Se connecter à GHCR avec le GITHUB_TOKEN automatique (pas de PAT nécessaire)
      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.REPO_OWNER_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Construire et publier l'image Backend sur GHCR
      # Deux tags : :latest (toujours à jour) et :<sha> (version figée par commit)
      - name: Construire et publier l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: Backend/EduTrack-api
          file: Backend/EduTrack-api/EduTrack-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/edutrack-backend:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/edutrack-backend:${{ github.sha }}

      # 6. Construire et publier l'image Frontend sur GHCR
      # Deux tags : :latest (toujours à jour) et :<sha> (version figée par commit)
      - name: Construire et publier l'image Frontend
        uses: docker/build-push-action@v6
        with:
          context: FrontEnd/Edu-Track
          file: FrontEnd/Edu-Track/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/edutrack-frontend:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/edutrack-frontend:${{ github.sha }}

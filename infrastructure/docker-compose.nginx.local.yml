name: edutrack

services:
  nginx:
    image: nginx:alpine
    container_name: edutrack-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Nginix/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - edutrack
